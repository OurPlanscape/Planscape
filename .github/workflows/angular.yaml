name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  # Only runs on PRs. On push (or if this job fails) the output is empty,
  # so the jobs below fall through and run.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'src/interface/**'
              - '.github/workflows/angular.yaml'

  lint-frontend:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.frontend != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/interface

    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: src/interface/.node-version
          cache: 'npm'
          cache-dependency-path: src/interface/package-lock.json
      - run: npm ci
      - run: npm run lint

  build-frontend:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.frontend != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/interface

    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: src/interface/.node-version
          cache: 'npm'
          cache-dependency-path: src/interface/package-lock.json
      - run: npm ci
      - run: npm run test:prod

  storybook:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.frontend != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/interface

    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: src/interface/.node-version
          cache: 'npm'
          cache-dependency-path: src/interface/package-lock.json
      - run: npm ci
      - run: npm run build-storybook
