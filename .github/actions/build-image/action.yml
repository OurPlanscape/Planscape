name: Build and push image
description: >-
  Builds a Docker image for the current commit and pushes it to Artifact
  Registry. Skips the build when an image with the same tag already exists.

inputs:
  app_name:
    description: Image name (planscape-backend, planscape-gateway, planscape-frontend-builder)
    required: true
  dockerfile:
    description: Dockerfile to build
    required: true
  image_tag:
    description: Tag for the image, normally the commit sha
    required: true
  credentials_json:
    description: GCP service account key
    required: true

runs:
  using: composite
  steps:
    - uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ inputs.credentials_json }}

    - uses: google-github-actions/setup-gcloud@v3

    - name: Configure Docker for Artifact Registry
      shell: bash
      run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

    - name: Check whether the image already exists
      id: check
      shell: bash
      run: |
        if make -s image-exists APP_NAME="${{ inputs.app_name }}" IMAGE_TAG="${{ inputs.image_tag }}"; then
          echo "Image already exists, skipping build: $(make -s image-tag APP_NAME="${{ inputs.app_name }}" IMAGE_TAG="${{ inputs.image_tag }}")"
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi

    - if: steps.check.outputs.exists != 'true'
      uses: docker/setup-buildx-action@v3

    - if: steps.check.outputs.exists != 'true'
      name: Build and push
      shell: bash
      run: >-
        make build-push
        APP_NAME="${{ inputs.app_name }}"
        DOCKERFILE="${{ inputs.dockerfile }}"
        IMAGE_TAG="${{ inputs.image_tag }}"
