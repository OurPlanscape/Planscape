<sg-modal
  [title]="title"
  [showClose]="false"
  secondaryButtonText="Cancel"
  [primaryButtonText]="primaryCTA"
  [hasPrimarySpinner]="true"
  [isInSpinState]="submitting"
  [primaryButtonDisabled]="submitting || form.invalid"
  (clickedSecondary)="cancel()"
  (clickedClose)="cancel()"
  (clickedPrimary)="handleSubmit()">
  <div modalBodyContent>
    <form [formGroup]="form" (ngSubmit)="handleSubmit()">
      <sg-input-field
        label="Workspace name"
        size="full"
        [error]="displayError"
        showSupportMessage="on-error"
        [supportMessage]="errorMessage || ''">
        <input
          sgInput
          name="name"
          placeholder="Insert text"
          cdkFocusInitial
          [required]="true"
          formControlName="name" />
      </sg-input-field>
    </form>
  </div>
</sg-modal>
