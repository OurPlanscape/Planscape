<sg-overlay-loader *ngIf="isWorkspaceLoading$ | async"></sg-overlay-loader>

<div class="no-workspace" *ngIf="workspaceNotFound$ | async">
  <app-resource-unavailable resource="workspace"></app-resource-unavailable>
</div>

<ng-container *ngIf="currentWorkspace$ | async as workspace">
  <sg-dashboard-layout
    class="workspace-dashboard-layout"
    layoutVariant="disable-right-scroll">
    <div header class="workspace-overview-column">
      <app-nav-bar area="SCENARIO"></app-nav-bar>
    </div>
    <div left-column class="left-column">
      <sg-details-card
        titleLabel="Workspace"
        [cardTitle]="workspace.name"
        [creator]="workspace.creator"
        [canShare]="canShare(workspace)"
        [created_at]="workspace.created_at"
        (share)="shareWorkspace(workspace)">
      </sg-details-card>

      <sg-card-link
        label="Map Viewer"
        [subLabel]="subLabelText"
        height="extra-tall"
        [collapseContentOnSmall]="true"
        (navigate)="handleNavigation()"
        [collapseContentOnSmall]="false">
        <img
          class="map-image"
          cardContent
          src="assets/svg/map_layer.svg"
          alt="map" />
      </sg-card-link>

      <button
        *ngIf="canManageDataLayers(workspace)"
        type="button"
        class="data-layers-card"
        (click)="goToDataLayers()">
        <span class="data-layers-icon">
          <mat-icon class="material-symbols-outlined"
            >drive_folder_upload</mat-icon
          >
        </span>
        <span class="data-layers-text">
          <span class="data-layers-title">Data Layers</span>
          <span class="data-layers-summary">
            {{ (dataLayersSummary$ | async) ?? 'Manage uploaded data' }}
          </span>
        </span>
        <mat-icon class="data-layers-chevron">chevron_right</mat-icon>
      </button>
    </div>
    <div right-column class="planing-areas-column">
      <app-planning-area-list></app-planning-area-list>
    </div>
  </sg-dashboard-layout>
</ng-container>
