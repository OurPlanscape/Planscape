<button
  sg-button
  variant="ghost"
  class="footer-button configuration-button"
  (click)="setDisplayOverlay(true)"
  [disabled]="displayScenarioConfigOverlay$ | async"
  [matMenuTriggerFor]="popoverMenu"
  (menuClosed)="setDisplayOverlay(false)">
  View Configurations
</button>
<mat-menu #popoverMenu="matMenu" class="scenario-config-overlay">
  <!-- Preventing modal to be closed if you click on the content-->
  <div
    matMenuContent
    (click)="$event.stopPropagation()"
    *ngIf="displayScenarioConfigOverlay$ | async">
    <!-- We should be able to delete these two overlay components once ADV_STAND_LEVEL_CONSTRAINTS is stable -->
    <ng-container *appFeatureFlag="'ADV_STAND_LEVEL_CONSTRAINTS'; hide: true">
      <app-legacy-scenario-config-overlay
        *ngIf="
          scenarioVersion === 'V2' || scenarioVersion === 'V1'
        "></app-legacy-scenario-config-overlay>
      <app-scenario-config-overlay
        *ngIf="scenarioVersion === 'V3'"></app-scenario-config-overlay>
    </ng-container>
    <app-scenario-config-list-overlay
      *appFeatureFlag="'ADV_STAND_LEVEL_CONSTRAINTS'">
    </app-scenario-config-list-overlay>
  </div>
</mat-menu>

<div class="download-container">
  <mat-spinner diameter="24" *ngIf="downloadingScenario"></mat-spinner>
  <button
    sg-button
    *ngIf="geoPackageStatus"
    variant="primary"
    class="footer-button"
    [disabled]="
      downloadingScenario ||
      geoPackageStatus === 'PENDING' ||
      geoPackageStatus === 'PROCESSING'
    "
    (click)="handleButton()">
    {{ buttonLabels[geoPackageStatus] || 'Generating GeoPackage' }}
  </button>
</div>
