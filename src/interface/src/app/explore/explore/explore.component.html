<app-nav-bar area="EXPLORE"></app-nav-bar>
<section>
  <div
    class="main"
    [ngClass]="{
      'with-icon-rail': dataOrganizationEnabled,
      'panel-expanded': panelExpanded,
    }">
    <app-explore-sidebar
      *appFeatureFlag="'DATA_ORGANIZATION'"
      [expanded]="panelExpanded"
      [selectedTab]="tabIndex"
      (expandedChange)="setPanelExpanded($event)"
      (selectedTabChange)="onTabIndexChange($event)"></app-explore-sidebar>
    <app-legacy-sidebar
      *appFeatureFlag="'DATA_ORGANIZATION'; hide: true"
      [expanded]="panelExpanded"
      [selectedTab]="tabIndex"
      (expandedChange)="setPanelExpanded($event)"
      (selectedTabChange)="onTabIndexChange($event)"></app-legacy-sidebar>
    <app-map-nav-bar>
      <app-multi-map-control></app-multi-map-control>
      <sg-opacity-slider
        class="navbar-slider"
        [minValue]="0"
        [maxValue]="1"
        [step]="0.01"
        [sliderValue]="(dataLayerOpacity$ | async) ?? defaultDataLayerOpacity"
        (valueChange)="handleOpacityChange($event)"
        tooltip="Layer Opacity"></sg-opacity-slider>

      <div *ngIf="totalAcres$ | async as totalAcres" class="total-acres">
        Total Acres: {{ totalAcres | number: '1.0-0' }}
      </div>

      <app-explore-modes-selection-toggle
        *ngIf="
          showSelectionToggle$ | async
        "></app-explore-modes-selection-toggle>
    </app-map-nav-bar>
    <app-synced-maps [ngClass]="{ withPanel: panelExpanded }"></app-synced-maps>
  </div>
</section>
