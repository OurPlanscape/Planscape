<app-sidebar-icon-rail
  [items]="railItems"
  [activeId]="expanded ? activeItemId : null"
  (itemSelected)="selectItem($event)">
  <ng-container *ngIf="canUpload$ | async">
    <button
      type="button"
      class="upload-button"
      aria-label="Upload data"
      matTooltip="Upload data"
      matTooltipPosition="right"
      (click)="openUpload()">
      <mat-icon class="material-symbols-outlined">upload</mat-icon>
    </button>
    <hr class="upload-divider" />
  </ng-container>
</app-sidebar-icon-rail>

<div class="panel" *ngIf="expanded">
  <div class="panel-header">
    <ng-container
      *ngIf="
        selectedTab === SidebarTabs.DATA_LAYERS &&
          (dataLayersSelection$ | async);
        else title;
        let selection
      ">
      <button
        sg-button
        variant="icon-only"
        icon="arrow_back"
        class="back-button"
        aria-label="Back"
        (click)="goBack()"></button>
      <h4 class="selection-title">{{ selection.name }}</h4>
    </ng-container>
    <ng-template #title>
      <h4>{{ activeItem?.label }}</h4>
    </ng-template>
    <button
      sg-button
      variant="icon-only"
      icon="close_fullscreen"
      (click)="expandedChange.emit(false)"></button>
  </div>
  <div class="panel-content">
    <app-map-tabs
      *ngIf="selectedTab === SidebarTabs.DATA_LAYERS"></app-map-tabs>
    <app-map-tabs
      panel="favorites"
      *ngIf="selectedTab === SidebarTabs.FAVORITES"></app-map-tabs>
    <app-base-layers
      *ngIf="selectedTab === SidebarTabs.BASE_LAYERS"></app-base-layers>
  </div>
</div>
