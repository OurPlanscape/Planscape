<sg-modal
  title="Stand-level Constraints Configuration"
  [showClose]="true"
  primaryButtonText="Apply"
  [hasSecondaryButton]="editMode"
  secondaryButtonText="Delete"
  secondaryButtonVariant="negative"
  [hasPrimarySpinner]="true"
  (clickedClose)="cancel()"
  (clickedPrimary)="handleApply()"
  (clickedSecondary)="handleRemove()"
  [primaryButtonDisabled]="form.invalid">
  <div modalBodyContent>
    <sg-modal-info
      modalInfoBox
      infoType="info"
      leadingIcon="info_filled"
      message="Advanced constraints will be applied to results but are not shown on the map.">
    </sg-modal-info>
    <div *ngIf="dataLayerName" class="form-heading-row">
      Only treat stands where
      <span class="datalayer-name">{{ dataLayerName }}</span> is:
    </div>
    <form [formGroup]="form" class="constraints-form">
      <div class="inputs-grid">
        <div class="col-left">
          <div class="label">Operator <span class="required">*</span></div>
          <mat-form-field
            class="operator-picker"
            appearance="outline"
            subscriptSizing="dynamic">
            <mat-select
              name="constraintOperator"
              formControlName="constraintOperator">
              @for (op of constraintOperators; track op.value) {
                <mat-option class="nav-page-item" [value]="op.value">
                  {{ op.label }}
                  @if (op.symbol) {
                    ({{ op.symbol }})
                  }
                </mat-option>
              }
            </mat-select>
            <mat-hint class="hint-blurb" *ngIf="isMultiOperator"
              >This operator accepts comma-separated values.</mat-hint
            >
          </mat-form-field>
        </div>

        <div class="col-right">
          <sg-input-field
            [disabled]="false"
            class="value-input"
            [label]="valueOneLabel"
            showSupportMessage="on-error"
            size="full"
            [supportMessage]="valueOneErrorMsg"
            [error]="valueOneHasErrors">
            <input
              sgInput
              placeholder="Value"
              name="constraintValueOne"
              cdkFocusInitial
              formControlName="constraintValueOne"
              required
              id="constraintValueOne"
              type="text" />
          </sg-input-field>
        </div>

        <ng-container *ngIf="showSecondValue">
          <div class="row-text row-2">
            <sg-input-field
              [disabled]="false"
              class="value-input"
              [label]="valueTwoLabel"
              required
              showSupportMessage="on-error"
              [supportMessage]="valueTwoErrorMsg"
              [error]="valueTwoHasErrors"
              size="full">
              <input
                sgInput
                placeholder="Value"
                name="constraintValueTwo"
                cdkFocusInitial
                formControlName="constraintValueTwo"
                required
                id="constraintValueTwo"
                type="number" />
            </sg-input-field>
          </div>
        </ng-container>
      </div>
    </form>
  </div>
</sg-modal>
