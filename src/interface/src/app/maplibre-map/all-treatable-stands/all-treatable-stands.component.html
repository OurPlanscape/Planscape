<mgl-vector-source
  id="scenarioProjectAreasLayer"
  [tiles]="[vectorLayer]"
  promoteId="id">
</mgl-vector-source>

<mgl-layer
  id="projectAreasFill"
  type="fill"
  source="scenarioProjectAreasLayer"
  [sourceLayer]="martinSource.sources.standsByPlanningArea"
  [paint]="standPaint">
</mgl-layer>

<mgl-layer
  id="projectAreasOutline"
  type="line"
  source="scenarioProjectAreasLayer"
  [sourceLayer]="martinSource.sources.standsByPlanningArea"
  [paint]="standOutlinePaint">
</mgl-layer>
