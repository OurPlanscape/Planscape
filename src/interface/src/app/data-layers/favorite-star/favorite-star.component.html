<span
  *ngIf="enabled"
  class="favorite-star-slot"
  [matTooltip]="(tooltip$ | async) || ''"
  (click)="blockClick($event)">
  <button
    type="button"
    class="favorite-star"
    [class.favorited]="isFavorite$ | async"
    [disabled]="isReadOnly$ | async"
    [attr.aria-pressed]="isFavorite$ | async"
    [attr.aria-label]="
      (isFavorite$ | async) ? 'Remove from favorites' : 'Add to favorites'
    "
    (click)="toggle($event)">
    <mat-icon
      [class.material-symbols-outlined]="(isFavorite$ | async) === false">
      star
    </mat-icon>
  </button>
</span>
