<div class="container">
  <div class="col left-panel" *appFeatureFlag="'DATA_ORGANIZATION'">
    <sg-section
      headline="Select Data Layers"
      [required]="true"
      class="datalayers-section"
      tooltipIcon="help"
      tooltipLink="https://support.planscape.org/support/solutions/articles/32000036443-how-to-use-climate-foresightToDoc"
      [headlineHint]="
        (selectedCount$ | async) + '/' + maxDataLayers + ' Selected'
      ">
      <div class="padding-section">
        <p class="description bold-paragraph">
          Select the data layers you want to include in your Climate Foresight
          analysis (up to {{ maxDataLayers }}).
        </p>
        <p class="description">
          Choose layers that represent current landscape conditions you want to
          evaluate based on future climate conditions. These layers will form
          the foundation of your analysis.
        </p>

        <sg-chip-selector
          [items]="(selectedDataLayers$ | async) ?? []"
          (removeItem)="removeDataLayer($event)"></sg-chip-selector>
      </div>

      <app-data-layers-rail
        [useClearFooter]="false"
        [displayAddButton]="true"></app-data-layers-rail>
    </sg-section>
  </div>

  <app-legacy-data-layer-selection
    *appFeatureFlag="
      'DATA_ORGANIZATION';
      hide: true
    "></app-legacy-data-layer-selection>

  <div class="col dataLayers-map">
    <app-climate-foresight-map></app-climate-foresight-map>
  </div>
</div>
