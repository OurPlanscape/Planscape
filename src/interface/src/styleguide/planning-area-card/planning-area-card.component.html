<div class="map-container">
  <ng-content select="[mapSlot]"></ng-content>
</div>
<div class="content">
  <div class="header">
    <div class="title">{{ planningArea.name }}</div>
    <app-planning-area-menu
      class="menu"
      [plan]="planningArea"
      [showOpen]="false"
      [showViewMap]="false"
      [showShare]="false"
      (afterDelete)="afterDelete.emit()"
      (afterRename)="afterRename.emit()"></app-planning-area-menu>
  </div>
  <div class="details-row">
    <div class="detail-column">
      <div class="detail-header">Creator</div>
      <div class="detail-info">{{ planningArea.creator }}</div>
    </div>
    <div class="detail-column">
      <div class="detail-header">Total Acres</div>
      <div class="detail-info">
        {{ planningArea.area_acres | number: '1.0-0' }}
      </div>
    </div>
    <div class="detail-column">
      <div class="detail-header">Date Created</div>
      <div class="detail-info">
        {{ planningArea.created_at | date: 'MMM d, y' }}
      </div>
    </div>
  </div>
</div>
