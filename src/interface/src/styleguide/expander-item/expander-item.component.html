<input
  type="radio"
  [value]="value"
  [id]="'layer-' + value"
  [name]="groupName"
  [checked]="checked"
  (click)="optionSelected.emit(value)" />
<label [for]="'layer-' + value">{{ label }}</label>
<sg-popover
  *ngIf="showTooltip"
  [modal]="tooltipInteractive"
  [contentTemplate]="tooltipTemplate">
  <ng-content></ng-content>
</sg-popover>
