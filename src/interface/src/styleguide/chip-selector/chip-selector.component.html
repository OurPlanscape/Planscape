<mat-chip-set class="sg-chip-set">
  <mat-chip-row
    class="chip-row"
    *ngFor="let item of displayedItems"
    (removed)="handleRemove(item)"
    (click)="handleClick(item)"
    [disableRipple]="true"
    [class.is-hoverable]="hoverable">
    <mat-icon class="material-symbols-outlined" *ngIf="showEdit" matChipAvatar
      >edit</mat-icon
    >
    {{ item.name }}
    <button *ngIf="showClose" class="chip-button" matChipRemove>
      <mat-icon>close</mat-icon>
    </button>
  </mat-chip-row>
  <div *ngIf="items.length > maxCollapsedItems" class="trailing-link">
    <a
      class="expand-link"
      *ngIf="!expanded && hiddenCount > 0"
      (click)="expand()"
      >See +{{ hiddenCount }} more</a
    >
    <a class="expand-link" *ngIf="expanded" (click)="collapse()">See Less</a>
  </div>
</mat-chip-set>
