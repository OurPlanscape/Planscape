substitutions:
  _DOCKERFILE: Dockerfile
  _IMAGE: us-central1-docker.pkg.dev/planscape-23d66/planscape-planscape-backend/planscape-backend:latest
  _CACHE_FROM: ""
  _SECRET_KEY_SECRET: planscape-backend-secret-key-dev

steps:
  - name: ghcr.io/astral-sh/uv:python3.10-bookworm-slim
    entrypoint: bash
    secretEnv:
      - SECRET_KEY
    args:
      - -c
      - |
        if [ "${_DOCKERFILE}" != "Dockerfile" ]; then
          echo "Skipping collectstatic for ${_DOCKERFILE}."
          exit 0
        fi

        apt-get update && apt-get -y install \
          g++ binutils \
          openssh-client \
          libc6-dev libsqlite3-dev \
          libpng-dev libtiff-dev libjpeg-dev \
          libgdal-dev libproj-dev libgeos-dev gdal-bin \
          libpq-dev libfreetype-dev libfontconfig1-dev libxml2-dev \
          libgit2-dev libharfbuzz-dev libfribidi-dev libudunits2-dev \
          libcurl4-openssl-dev libssl-dev \
          postgresql-client \
          python3-pip

        uv sync --locked --no-install-project --dev
        uv run --directory=src/planscape python manage.py collectstatic --no-input

  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        if [ -n "${_CACHE_FROM}" ]; then
          docker pull "${_CACHE_FROM}" || true
          docker build --cache-from "${_CACHE_FROM}" -f "${_DOCKERFILE}" -t "${_IMAGE}" .
        else
          docker build -f "${_DOCKERFILE}" -t "${_IMAGE}" .
        fi
images:
  - ${_IMAGE}
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/${_SECRET_KEY_SECRET}/versions/latest
      env: SECRET_KEY
options:
  machineType: 'E2_HIGHCPU_8'
